# =============================================================
# Local infrastructure for the mini banking platform.
#
#   postgres   - single instance, one database per service
#   redis      - shared cache + idempotency store
#   redpanda   - event bus (Kafka API, single node), same as the VPS
#   kafka-ui   - web UI to inspect topics/messages (http://localhost:8085)
#   pgadmin    - web UI to inspect the databases
#
# Usage (from the root of this repo):
#   docker compose up -d
#   docker compose down          # stop, keep data
#   docker compose down -v       # stop and wipe all data (re-runs init scripts)
# =============================================================

name: banking-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: banking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # default maintenance db; per-service dbs are created by init scripts
      POSTGRES_DB: postgres
    ports:
      # Host port is configurable when 5432 is taken (e.g. a local PostgreSQL install).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # init scripts run only on a fresh volume, in filename order.
      # This repo maps 1:1 so that \i /docker-entrypoint-initdb.d/<svc>/schema.sql resolves.
      # Only the top-level *.sql files run as init scripts; other files are ignored.
      - ./:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-net

  redis:
    image: redis:7-alpine
    container_name: banking-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-net

  # Same broker as the VPS (Redpanda speaks the Kafka protocol), with the same small settings.
  #   from the host:        localhost:19092
  #   from a container:     banking-redpanda:9092 (or redpanda:9092)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.10
    container_name: banking-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=256M
      - --reserve-memory=0M
      - --overprovisioned
      - --default-log-level=warn
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://banking-redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - banking-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: banking-kafka-ui
    restart: unless-stopped
    depends_on:
      - redpanda
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: banking
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "banking-redpanda:9092"
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - banking-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: banking-pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8086:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@banking.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - banking-net

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
  pgadmin_data:

networks:
  banking-net:
    driver: bridge
