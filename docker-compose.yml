# =============================================================
# Local infrastructure for the mini banking platform.
#
#   postgres   - single instance, one database per service
#   redis      - shared cache + idempotency store
#   kafka      - event bus (KRaft mode, no Zookeeper)
#   kafka-ui   - web UI to inspect topics/messages
#   pgadmin    - web UI to inspect the databases
#
# Usage (from the root of this repo):
#   docker compose up -d
#   docker compose down          # stop, keep data
#   docker compose down -v       # stop and wipe all data (re-runs init scripts)
# =============================================================

name: banking-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: banking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # default maintenance db; per-service dbs are created by init scripts
      POSTGRES_DB: postgres
    ports:
      # Host port is configurable when 5432 is taken (e.g. a local PostgreSQL install).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # init scripts run only on a fresh volume, in filename order.
      # This repo maps 1:1 so that \i /docker-entrypoint-initdb.d/<svc>/schema.sql resolves.
      # Only the top-level *.sql files run as init scripts; other files are ignored.
      - ./:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-net

  redis:
    image: redis:7-alpine
    container_name: banking-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-net

  kafka:
    image: bitnami/kafka:3.7
    container_name: banking-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"   # external listener for host apps
      - "9094:9094"   # internal listener for other containers
    environment:
      # ---- KRaft (no Zookeeper) ----
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # ---- Listeners ----
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9094,CONTROLLER://:9093,EXTERNAL://:9092"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9094,EXTERNAL://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # ---- Dev-friendly defaults ----
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9094 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - banking-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: banking-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: banking
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9094"
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - banking-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: banking-pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8086:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@banking.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - banking-net

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  pgadmin_data:

networks:
  banking-net:
    driver: bridge
